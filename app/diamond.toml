schema_version = 1
assets = { map0 = "assets/map-0.svg", map1 = "assets/map-1.svg", map2 = "assets/map-2.svg", map3 = "assets/map-3.svg", map4 = "assets/map-4.svg", map5 = "assets/map-5.svg", map6 = "assets/map-6.svg", map7 = "assets/map-7.svg", map8 = "assets/map-8.svg", map9 = "assets/map-9.svg", map10 = "assets/map-10.svg", map11 = "assets/map-11.svg", map12 = "assets/map-12.svg", map13 = "assets/map-13.svg", map14 = "assets/map-14.svg", map15 = "assets/map-15.svg" }
name = "ArteriesWeb"
server = "server"
browser = "ui"
component = "Root"
provides = ["DbRead<Worlds>", "DbWrite<Worlds>", "DbRead<Towns>", "DbWrite<Towns>", "DbRead<Sites>", "DbWrite<Sites>", "DbRead<Routes>", "DbWrite<Routes>", "DbRead<Projects>", "DbWrite<Projects>", "DbRead<Logs>", "DbWrite<Logs>", "DbRead<History>", "DbWrite<History>", "Compute<arteries.terrain_region>", "Compute<arteries.pathfind>", "Compute<arteries.route_cost>"]
styles = ["app.css"]

[modules.shared]
path = "shared.dia"
target = "shared"
imports = ["rt_tables"]

[modules.rt_tables]
path = "rt_tables.dia"
target = "shared"

[modules.server]
path = "server.dia"
target = "server"
imports = ["shared"]
provides = ["DbRead<Worlds>", "DbWrite<Worlds>", "DbRead<Towns>", "DbWrite<Towns>", "DbRead<Sites>", "DbWrite<Sites>", "DbRead<Routes>", "DbWrite<Routes>", "DbRead<Projects>", "DbWrite<Projects>", "DbRead<Logs>", "DbWrite<Logs>", "DbRead<History>", "DbWrite<History>", "Compute<arteries.terrain_region>", "Compute<arteries.pathfind>", "Compute<arteries.route_cost>"]

[modules.ui]
path = "ui.dia"
target = "browser"
imports = ["shared"]

[rpc]
load_game = "server.load_game"
advance_market = "server.advance_market"
advance_finish = "server.advance_finish"
start_route = "server.start_route"
order_upgrade = "server.order_upgrade"
dismantle = "server.dismantle"
cancel_project = "server.cancel_project"
terrain_region = "server.terrain_region"
survey_path = "server.survey_path"
set_fee = "server.set_fee"
pay_upkeep = "server.pay_upkeep"
toggle_auto = "server.toggle_auto"
new_seed = "server.new_seed"

[storage]
profile = "relational-v1"
version = 1

[storage.resources.Worlds]
scope = "id"

[storage.resources.Towns]
scope = "world"
unique = [["world", "ord"]]

[storage.resources.Towns.references.world]
resource = "Worlds"
fields = { world = "id" }

[storage.resources.Sites]
scope = "world"
unique = [["world", "ord"]]

[storage.resources.Sites.references.world]
resource = "Worlds"
fields = { world = "id" }

[storage.resources.Routes]
scope = "world"
unique = [["world", "ord"]]

[storage.resources.Routes.references.world]
resource = "Worlds"
fields = { world = "id" }

[storage.resources.Projects]
scope = "world"
unique = [["world", "ord"]]

[storage.resources.Projects.references.world]
resource = "Worlds"
fields = { world = "id" }

[storage.resources.Logs]
scope = "world"
unique = [["world", "epoch", "seq"]]

[storage.resources.Logs.references.world]
resource = "Worlds"
fields = { world = "id" }

[storage.resources.History]
scope = "world"
unique = [["world", "epoch", "seq"]]

[storage.resources.History.references.world]
resource = "Worlds"
fields = { world = "id" }

[identity]
profile = "accounts-v1"
enrollment = "invite"

[compute.arteries]
kind = "host"

[compute.arteries.exports.terrain_region]
arguments = ["Int", "Int", "Int", "Int", "Int", "Int", "Int"]
result = "Text"
deterministic = true

[compute.arteries.exports.pathfind]
arguments = ["Text", "Text", "Text", "Text"]
result = "List<Int>"
deterministic = true
max_input_bytes = 131072
max_output_bytes = 65536
max_duration_ms = 2000

[compute.arteries.exports.route_cost]
arguments = ["Text", "List<Int>", "Text"]
result = "List<Int>"
deterministic = true
max_input_bytes = 131072
max_output_bytes = 4096
max_duration_ms = 2000

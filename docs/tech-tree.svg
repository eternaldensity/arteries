<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Arteries branching technology and production tree</title>
  <desc id="desc">The current tech tree branches: Roads and Carpentry are independent era-2 openings, River barges requires both, Metallurgy opens from Roads, and Rail requires River barges and Metallurgy. Route upgrades consume produced planks and steel, and the branch techs reduce those material requirements.</desc>

  <defs>
    <radialGradient id="bgA" cx="12%" cy="8%" r="58%">
      <stop offset="0%" stop-color="#173252" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#173252" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgB" cx="92%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#4a3218" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#4a3218" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7188aa"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e0ac5c"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#69c3b3"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #070d17; }
    .eyebrow { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 12px; font-weight: 650; letter-spacing: 2.6px; fill: #7890b2; }
    .h1 { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 31px; font-weight: 700; fill: #f4f7fc; letter-spacing: -0.4px; }
    .sub { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #9aabc5; }
    .meta { font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", ui-monospace, monospace; font-size: 11px; fill: #8fa5c4; }
    .era { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 10.5px; font-weight: 650; letter-spacing: 1.8px; fill: #8ea5c4; }
    .card { fill: #0f1a2b; stroke: #2a405e; stroke-width: 1.2; filter: url(#shadow); }
    .start { fill: #0c1727; stroke: #36506f; stroke-width: 1.2; stroke-dasharray: 7 6; filter: url(#shadow); }
    .top-blue { stroke: #6f90ba; stroke-width: 4; stroke-linecap: round; }
    .top-amber { stroke: #e0ac5c; stroke-width: 4; stroke-linecap: round; }
    .top-teal { stroke: #69c3b3; stroke-width: 4; stroke-linecap: round; }
    .top-rose { stroke: #e07a8a; stroke-width: 4; stroke-linecap: round; }
    .card-title { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 22px; font-weight: 650; fill: #f4f7fc; }
    .card-sub { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 11.5px; fill: #8fa5c4; }
    .body { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 12.5px; fill: #c6d3e6; }
    .muted { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 11px; fill: #8297b6; }
    .cost { font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", ui-monospace, monospace; font-size: 23px; font-weight: 600; fill: #f0c47b; }
    .cost-unit { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; fill: #9c8863; }
    .chip { fill: #142238; stroke: #2d4768; stroke-width: 1; }
    .chip-text { font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", ui-monospace, monospace; font-size: 10px; fill: #b9cce5; }
    .effect { fill: #121d2e; stroke: #31506f; stroke-width: 1; }
    .effect-text { font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", ui-monospace, monospace; font-size: 10px; fill: #7fd0c0; }
    .material { fill: #1a1a14; stroke: #5b4d2d; stroke-width: 1; }
    .material-text { font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", ui-monospace, monospace; font-size: 10px; fill: #e0c58c; }
    .timeline { stroke: #2a405e; stroke-width: 1.4; stroke-dasharray: 5 6; }
    .panel { fill: #0c1523; stroke: #253b57; stroke-width: 1; }
    .panel-title { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 11px; font-weight: 650; letter-spacing: 1.8px; fill: #8ea5c4; }
    .code { font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", ui-monospace, monospace; font-size: 11px; fill: #b9cce5; }
    .code-accent { fill: #e0ac5c; }
    .footer { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 11px; fill: #637897; }
  </style>

  <rect class="bg" width="1440" height="900"/>
  <rect width="1440" height="900" fill="url(#bgA)"/>
  <rect width="1440" height="900" fill="url(#bgB)"/>

  <text class="eyebrow" x="64" y="58">ARTERIES · TECHNOLOGY</text>
  <text class="h1" x="64" y="96">Branching tech tree + production</text>
  <text class="sub" x="64" y="124">Technology unlocks route upgrades; route upgrades consume produced planks and steel.</text>
  <text class="meta" x="1376" y="62" text-anchor="end">5 technologies · 4 eras</text>
  <text class="meta" x="1376" y="84" text-anchor="end">catalog: app/tech_tables.dia</text>

  <!-- Era columns -->
  <line class="timeline" x1="60" y1="166" x2="1380" y2="166"/>
  <text class="era" x="160" y="146" text-anchor="middle">START</text>
  <text class="era" x="465" y="146" text-anchor="middle">ERA 2 · FOUNDATION</text>
  <text class="era" x="805" y="146" text-anchor="middle">ERA 3 · INDUSTRY</text>
  <text class="era" x="1150" y="146" text-anchor="middle">ERA 4 · RAILS</text>

  <!-- Edges first, so cards cover endpoints -->
  <path d="M270,380 C305,380 305,300 332,300" fill="none" stroke="#7188aa" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M270,470 C305,470 305,560 332,560" fill="none" stroke="#7188aa" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M590,290 L672,290" fill="none" stroke="#e0ac5c" stroke-width="1.7" marker-end="url(#arrowAmber)"/>
  <path d="M590,560 C630,560 640,400 672,340" fill="none" stroke="#e0ac5c" stroke-width="1.7" marker-end="url(#arrowAmber)"/>
  <path d="M590,360 C630,400 640,500 672,530" fill="none" stroke="#69c3b3" stroke-width="1.7" marker-end="url(#arrowTeal)"/>
  <path d="M930,320 C970,350 980,365 1012,385" fill="none" stroke="#69c3b3" stroke-width="1.7" marker-end="url(#arrowTeal)"/>
  <path d="M930,540 C970,520 980,495 1012,475" fill="none" stroke="#69c3b3" stroke-width="1.7" marker-end="url(#arrowTeal)"/>

  <!-- Start -->
  <rect class="start" x="50" y="300" width="220" height="250" rx="16"/>
  <line class="top-blue" x1="68" y1="302" x2="252" y2="302"/>
  <text class="card-title" x="72" y="352">Pack routes</text>
  <text class="card-sub" x="72" y="374">Starting mode · always available</text>
  <text class="body" x="72" y="408">Path links carry low volumes.</text>
  <text class="body" x="72" y="428">The first research unlocks</text>
  <text class="body" x="72" y="448">better road construction.</text>
  <rect class="chip" x="72" y="486" width="156" height="24" rx="7"/>
  <text class="chip-text" x="84" y="502">mode: Path · tier 0</text>
  <text class="muted" x="72" y="532">no research cost</text>

  <!-- Roads -->
  <rect class="card" x="340" y="180" width="250" height="220" rx="16"/>
  <line class="top-amber" x1="358" y1="182" x2="572" y2="182"/>
  <text class="card-title" x="362" y="230">Roads</text>
  <text class="card-sub" x="362" y="250">Improved carts</text>
  <text class="cost" x="362" y="286">45</text>
  <text class="cost-unit" x="408" y="284">RESEARCH</text>
  <rect class="effect" x="362" y="302" width="192" height="22" rx="6"/>
  <text class="effect-text" x="373" y="317">unlock_road</text>
  <rect class="material" x="362" y="334" width="192" height="22" rx="6"/>
  <text class="material-text" x="373" y="349">2 stone + 2 planks</text>
  <text class="muted" x="362" y="378">requires: —</text>

  <!-- Carpentry -->
  <rect class="card" x="340" y="450" width="250" height="220" rx="16"/>
  <line class="top-amber" x1="358" y1="452" x2="572" y2="452"/>
  <text class="card-title" x="362" y="500">Carpentry</text>
  <text class="card-sub" x="362" y="520">Sawmills and framing</text>
  <text class="cost" x="362" y="556">60</text>
  <text class="cost-unit" x="408" y="554">RESEARCH</text>
  <rect class="effect" x="362" y="572" width="192" height="22" rx="6"/>
  <text class="effect-text" x="373" y="587">discount_planks</text>
  <rect class="material" x="362" y="604" width="192" height="22" rx="6"/>
  <text class="material-text" x="373" y="619">planks 2→1 · 4→2</text>
  <text class="muted" x="362" y="648">requires: —</text>

  <!-- River barges -->
  <rect class="card" x="680" y="180" width="250" height="220" rx="16"/>
  <line class="top-teal" x1="698" y1="182" x2="912" y2="182"/>
  <text class="card-title" x="702" y="230">River barges</text>
  <text class="card-sub" x="702" y="250">River navigation</text>
  <text class="cost" x="702" y="286">110</text>
  <text class="cost-unit" x="762" y="284">RESEARCH</text>
  <rect class="effect" x="702" y="302" width="192" height="22" rx="6"/>
  <text class="effect-text" x="713" y="317">unlock_river</text>
  <rect class="material" x="702" y="334" width="192" height="22" rx="6"/>
  <text class="material-text" x="713" y="349">4 timber + 4 planks</text>
  <text class="muted" x="702" y="378">requires: Roads + Carpentry</text>

  <!-- Metallurgy -->
  <rect class="card" x="680" y="450" width="250" height="220" rx="16"/>
  <line class="top-teal" x1="698" y1="452" x2="912" y2="452"/>
  <text class="card-title" x="702" y="500">Metallurgy</text>
  <text class="card-sub" x="702" y="520">Smelting and steelworking</text>
  <text class="cost" x="702" y="556">140</text>
  <text class="cost-unit" x="762" y="554">RESEARCH</text>
  <rect class="effect" x="702" y="572" width="192" height="22" rx="6"/>
  <text class="effect-text" x="713" y="587">discount_steel</text>
  <rect class="material" x="702" y="604" width="192" height="22" rx="6"/>
  <text class="material-text" x="713" y="619">steel 4→2</text>
  <text class="muted" x="702" y="648">requires: Roads</text>

  <!-- Rail -->
  <rect class="card" x="1020" y="290" width="260" height="250" rx="16"/>
  <line class="top-rose" x1="1038" y1="292" x2="1242" y2="292"/>
  <text class="card-title" x="1042" y="344">Rail</text>
  <text class="card-sub" x="1042" y="366">Steam power</text>
  <text class="cost" x="1042" y="404">220</text>
  <text class="cost-unit" x="1108" y="402">RESEARCH</text>
  <rect class="effect" x="1042" y="422" width="202" height="22" rx="6"/>
  <text class="effect-text" x="1053" y="437">unlock_rail</text>
  <rect class="material" x="1042" y="454" width="202" height="22" rx="6"/>
  <text class="material-text" x="1053" y="469">4 steel + 2 tools</text>
  <text class="muted" x="1042" y="498">requires: River barges + Metallurgy</text>
  <text class="muted" x="1042" y="520">highest capacity mode</text>

  <!-- Bottom panels -->
  <rect class="panel" x="50" y="714" width="440" height="136" rx="12"/>
  <text class="panel-title" x="70" y="742">PRODUCTION INPUTS</text>
  <text class="code" x="70" y="768">Timber → Planks</text>
  <text class="code" x="280" y="768">Ore + Stone → Steel</text>
  <text class="code" x="70" y="792">Fiber → Cloth</text>
  <text class="code" x="280" y="792">Timber + Stone + Ore → Tools</text>
  <text class="muted" x="70" y="822">Produced goods are stockpiled, traded, and spent on upgrades.</text>

  <rect class="panel" x="510" y="714" width="430" height="136" rx="12"/>
  <text class="panel-title" x="530" y="742">TECH ↔ ROUTE MATERIALS</text>
  <text class="code" x="530" y="768">Road: 2 Stone + 2 Planks</text>
  <text class="code" x="530" y="792">Barge: 4 Timber + 4 Planks</text>
  <text class="code" x="530" y="816">Rail: 4 Steel + 2 Tools</text>
  <text class="muted" x="760" y="768">Carpentry halves planks.</text>
  <text class="muted" x="760" y="792">Metallurgy halves steel.</text>

  <rect class="panel" x="960" y="714" width="430" height="136" rx="12"/>
  <text class="panel-title" x="980" y="742">STATE &amp; DISCOVERY</text>
  <text class="code" x="980" y="768">world.tech = "11111"</text>
  <text class="code" x="980" y="792">research ≥ cost + prerequisites</text>
  <text class="muted" x="980" y="820">One bitset character per catalog row.</text>
  <text class="muted" x="980" y="838">Adding a tech is a catalog edit, not a schema change.</text>

  <text class="footer" x="64" y="878">Arteries prototype · branching transport spine · production and technology now feed each other</text>
</svg>

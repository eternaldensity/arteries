<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Arteries game architecture</title>
  <desc id="desc">Diamond browser and server modules share deterministic rules and baked worldgen tables. The server calls pure Rust compute kernels through the host compute boundary and persists world state in PostgreSQL.</desc>

  <defs>
    <radialGradient id="bgGlowA" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#15304f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#15304f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowB" cx="90%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#3a2a15" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3a2a15" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6f90ba"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e0ac5c"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#69c3b3"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #080d17; }
    .eyebrow { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 12px; font-weight: 650; letter-spacing: 2.4px; fill: #7890b2; }
    .h1 { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 30px; font-weight: 700; fill: #f4f7fc; letter-spacing: -0.4px; }
    .sub { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 14px; font-weight: 400; fill: #9aabc5; }
    .boundary { fill: none; stroke: #263d5a; stroke-width: 1.2; stroke-dasharray: 6 7; }
    .boundary-compute { stroke: #5b472c; }
    .boundary-label { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 10px; font-weight: 650; letter-spacing: 2.2px; fill: #6f86a8; }
    .boundary-label-compute { fill: #b8945f; }
    .card { fill: #101a2c; stroke: #263a56; stroke-width: 1.1; filter: url(#cardShadow); }
    .card-compute { fill: #18150f; stroke: #5a482d; }
    .card-db { fill: #0c1b1d; stroke: #2b5350; }
    .card-strip { fill: #0d1524; stroke: #22344e; stroke-width: 1.1; }
    .card-top { stroke: #385980; stroke-width: 2; stroke-linecap: round; }
    .card-top-compute { stroke: #b88945; }
    .card-top-db { stroke: #4f9c91; }
    .card-title { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 19px; font-weight: 650; fill: #f3f6fb; }
    .card-sub { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: #8297b6; }
    .label { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 10.5px; font-weight: 650; letter-spacing: 1.4px; fill: #8ea5c4; }
    .label-amber { fill: #c9a267; }
    .body { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #c6d3e6; }
    .body-strong { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #e5edf8; }
    .mono { font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", ui-monospace, monospace; font-size: 11.5px; font-weight: 400; fill: #b9cce5; }
    .mono-small { font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", ui-monospace, monospace; font-size: 10.5px; font-weight: 400; fill: #9fb4d1; }
    .muted { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 11px; font-weight: 400; fill: #7589a6; }
    .accent { fill: #e8b86d; }
    .teal { fill: #73cbbb; }
    .divider { stroke: #223650; stroke-width: 1; }
    .divider-compute { stroke: #3d3220; }
    .divider-db { stroke: #1d3d3a; }
    .chip { fill: #16243a; stroke: #2d4768; stroke-width: 1; }
    .chip-compute { fill: #241d13; stroke: #5a482d; }
    .chip-db { fill: #102726; stroke: #2b5350; }
    .chip-text { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 10.5px; font-weight: 600; fill: #9fb6d5; }
    .chip-text-compute { fill: #d0ab71; }
    .chip-text-db { fill: #7dc9bb; }
    .arrow { fill: none; stroke: #6f90ba; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .arrow-dashed { stroke-dasharray: 5 5; }
    .arrow-compute { stroke: #e0ac5c; }
    .arrow-db { stroke: #69c3b3; }
    .arrow-label { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 9.5px; font-weight: 600; fill: #8ba2c1; letter-spacing: 0.2px; }
    .arrow-label-compute { fill: #c8a269; }
    .arrow-label-db { fill: #76bdaf; }
    .legend-dot { stroke-width: 0; }
    .legend-text { font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 10.5px; font-weight: 550; fill: #9fb2cd; }
  </style>

  <rect class="bg" width="1600" height="1120"/>
  <rect width="1600" height="1120" fill="url(#bgGlowA)"/>
  <rect width="1600" height="1120" fill="url(#bgGlowB)"/>

  <!-- Header -->
  <text x="50" y="54" class="eyebrow">ARTERIES / SYSTEM ARCHITECTURE</text>
  <text x="50" y="94" class="h1">Deterministic transport economy on Diamond</text>
  <text x="50" y="122" class="sub">Diamond owns state, RPCs, and UI. Rust kernels own the heavy deterministic compute.</text>

  <!-- Legend -->
  <g transform="translate(1104 40)">
    <rect class="chip" x="0" y="0" width="140" height="32" rx="16"/>
    <circle class="legend-dot" cx="18" cy="16" r="4.5" fill="#6f90ba"/>
    <text class="legend-text" x="31" y="20">Diamond app</text>
    <rect class="chip chip-compute" x="152" y="0" width="146" height="32" rx="16"/>
    <circle class="legend-dot" cx="170" cy="16" r="4.5" fill="#e0ac5c"/>
    <text class="legend-text" x="183" y="20">Native compute</text>
    <rect class="chip chip-db" x="310" y="0" width="138" height="32" rx="16"/>
    <circle class="legend-dot" cx="328" cy="16" r="4.5" fill="#69c3b3"/>
    <text class="legend-text" x="341" y="20">PostgreSQL</text>
  </g>

  <!-- Boundaries -->
  <rect class="boundary" x="30" y="152" width="920" height="700" rx="24"/>
  <text x="52" y="145" class="boundary-label">DIAMOND APPLICATION</text>
  <rect class="boundary boundary-compute" x="980" y="152" width="590" height="600" rx="24"/>
  <text x="1002" y="145" class="boundary-label boundary-label-compute">NATIVE COMPUTE · PURE</text>

  <!-- Browser card -->
  <g>
    <rect class="card" x="50" y="170" width="300" height="310" rx="16"/>
    <line class="card-top" x1="74" y1="170.5" x2="326" y2="170.5"/>
    <text x="74" y="202" class="card-title">Browser UI</text>
    <text x="74" y="224" class="card-sub">ui.dia · Root component</text>
    <line class="divider" x1="74" y1="238" x2="326" y2="238"/>
    <text x="74" y="272" class="body">Reactive map + inspector</text>
    <text x="74" y="296" class="body">Route desk &amp; survey preview</text>
    <text x="74" y="320" class="body">Climate &amp; goods readouts</text>
    <text x="74" y="344" class="body">Compact scale overlay</text>
    <text x="74" y="368" class="body">Static map-*.svg + app.css</text>
    <rect class="chip" x="70" y="424" width="188" height="28" rx="14"/>
    <text class="chip-text" x="82" y="443">Diamond browser target</text>
  </g>

  <!-- Server card -->
  <g>
    <rect class="card" x="420" y="170" width="510" height="310" rx="16"/>
    <line class="card-top" x1="444" y1="170.5" x2="906" y2="170.5"/>
    <text x="444" y="202" class="card-title">Diamond server</text>
    <text x="444" y="224" class="card-sub">server.dia · typed RPC handlers</text>
    <line class="divider" x1="444" y1="238" x2="906" y2="238"/>
    <text x="444" y="272" class="body">Typed RPC surface: load_game, survey_*, advance_*</text>
    <text x="444" y="296" class="body">World load/save; staged market → trade → finish</text>
    <text x="444" y="320" class="body">Scoped DbRead / DbWrite capabilities</text>
    <text x="444" y="344" class="body">Builds deterministic kernel rows</text>
    <text x="444" y="368" class="body">Owns clock, projects, upkeep, history</text>
    <rect class="chip" x="440" y="424" width="182" height="28" rx="14"/>
    <text class="chip-text" x="452" y="443">Diamond server target</text>
  </g>

  <!-- Shared model card -->
  <g>
    <rect class="card" x="50" y="540" width="880" height="290" rx="16"/>
    <line class="card-top" x1="74" y1="540.5" x2="906" y2="540.5"/>
    <text x="74" y="572" class="card-title">Shared model &amp; baked tables</text>
    <text x="74" y="594" class="card-sub">shared.dia · worldgen_tables.dia · rt_tables.dia</text>
    <line class="divider" x1="74" y1="610" x2="906" y2="610"/>
    <line class="divider" x1="450" y1="626" x2="450" y2="770"/>

    <text x="74" y="640" class="label">RULES · SERVER + UI</text>
    <text x="74" y="666" class="mono">need_of · climate needs · depletion</text>
    <text x="74" y="690" class="mono">trade moves · route plans</text>
    <text x="74" y="714" class="mono">upkeep · events · history</text>
    <text x="74" y="744" class="muted">Compiled into both targets; same deterministic rules.</text>

    <text x="474" y="640" class="label">BAKED WORLDGEN · 16 SEEDS · 10×6</text>
    <text x="474" y="666" class="mono">terrain · features · economy class</text>
    <text x="474" y="690" class="mono">temperature · moisture · climate · deposits</text>
    <text x="474" y="714" class="mono">climate = f(temperature, moisture)</text>
    <text x="474" y="744" class="muted">Drift-checked against the Rust generator.</text>

    <rect class="chip" x="70" y="782" width="500" height="28" rx="14"/>
    <text class="chip-text" x="82" y="801">Shared/browser modules cannot call host ops.</text>
  </g>

  <!-- Native compute host card -->
  <g>
    <rect class="card card-compute" x="1000" y="170" width="550" height="200" rx="16"/>
    <line class="card-top card-top-compute" x1="1024" y1="170.5" x2="1526" y2="170.5"/>
    <text x="1024" y="202" class="card-title">Native compute host</text>
    <text x="1024" y="224" class="card-sub">arteries-runner · embedding host</text>
    <line class="divider divider-compute" x1="1024" y1="238" x2="1526" y2="238"/>
    <text x="1024" y="270" class="mono">Registers Compute&lt;arteries.*&gt; exports</text>
    <text x="1024" y="294" class="mono">host.compute&lt;Reply&gt;(module, export, …)</text>
    <text x="1024" y="318" class="body">Wire values only: no principal, DB, or secrets</text>
    <text x="1024" y="342" class="body">Per-export byte + duration limits</text>
    <rect class="chip chip-compute" x="1020" y="352" width="226" height="26" rx="13"/>
    <text class="chip-text chip-text-compute" x="1032" y="370">Server-module-only capability</text>
  </g>

  <!-- Arteries core card -->
  <g>
    <rect class="card card-compute" x="1000" y="400" width="550" height="300" rx="16"/>
    <line class="card-top card-top-compute" x1="1024" y1="400.5" x2="1526" y2="400.5"/>
    <text x="1024" y="432" class="card-title">arteries-core</text>
    <text x="1024" y="454" class="card-sub">Rust kernels · integer / fixed-point</text>
    <line class="divider divider-compute" x1="1024" y1="468" x2="1526" y2="468"/>

    <text x="1024" y="490" class="label label-amber">WORLDGEN</text>
    <text x="1024" y="510" class="mono">noise · worldgen · worldgen_summary · terrain_region</text>

    <text x="1024" y="538" class="label label-amber">ROUTING</text>
    <text x="1024" y="558" class="mono">pathfind · pathfind_features · route_cost</text>

    <text x="1024" y="586" class="label label-amber">ECONOMY</text>
    <text x="1024" y="606" class="mono">market · finish · trade</text>

    <text x="1024" y="634" class="label label-amber">PLANET</text>
    <text x="1024" y="654" class="mono">planet · planet_summary</text>

    <text x="1024" y="684" class="muted">No f64 in authoritative results · deterministic by construction.</text>
  </g>

  <!-- Postgres card -->
  <g>
    <rect class="card card-db" x="1000" y="780" width="550" height="250" rx="16"/>
    <line class="card-top card-top-db" x1="1024" y1="780.5" x2="1526" y2="780.5"/>
    <text x="1024" y="812" class="card-title">PostgreSQL</text>
    <text x="1024" y="834" class="card-sub">relational-v1 · storage v4</text>
    <line class="divider divider-db" x1="1024" y1="850" x2="1526" y2="850"/>
    <text x="1024" y="886" class="body">Worlds · Towns · Sites</text>
    <text x="1024" y="910" class="body">Routes · Projects</text>
    <text x="1024" y="934" class="body">Logs · History</text>
    <text x="1024" y="958" class="body">Scope: one world per account</text>
    <text x="1024" y="1000" class="muted">Additive migrations. No DB handle crosses the compute boundary.</text>
  </g>

  <!-- Build strip -->
  <g>
    <rect class="card-strip" x="50" y="880" width="880" height="190" rx="16"/>
    <text x="74" y="912" class="card-title">Build &amp; verification</text>
    <text x="74" y="934" class="card-sub">Reproducible from seeds and the manifest.</text>
    <line class="divider" x1="74" y1="950" x2="906" y2="950"/>

    <text x="74" y="980" class="mono">diamond check/build</text>
    <text x="74" y="998" class="muted">validated manifest + artifact</text>
    <text x="74" y="1020" class="mono">arteries-gen worldgen</text>
    <text x="74" y="1038" class="muted">→ worldgen_tables.dia</text>

    <text x="470" y="980" class="mono">tools/gen-maps.sh</text>
    <text x="470" y="998" class="muted">→ 16 static SVG maps</text>
    <text x="470" y="1020" class="mono">tools/check-*.sh</text>
    <text x="470" y="1038" class="muted">core / table / fixture drift</text>

    <text x="74" y="1060" class="mono-small">tests/ui-smoke.js</text>
    <text x="190" y="1060" class="muted">Playwright acceptance</text>
    <text x="470" y="1060" class="mono-small">cargo test + clippy</text>
    <text x="596" y="1060" class="muted">Rust kernels</text>
  </g>

  <!-- Arrows -->
  <g>
    <!-- RPC -->
    <line class="arrow" x1="350" y1="318" x2="414" y2="318" marker-end="url(#arrowBlue)"/>
    <text x="385" y="303" text-anchor="middle" class="arrow-label">RPC</text>
    <text x="385" y="339" text-anchor="middle" class="arrow-label">typed HTTP</text>

    <!-- Host compute -->
    <line class="arrow arrow-compute" x1="930" y1="318" x2="994" y2="318" marker-end="url(#arrowAmber)"/>
    <text x="965" y="300" text-anchor="middle" class="arrow-label arrow-label-compute">host.compute</text>
    <text x="965" y="339" text-anchor="middle" class="arrow-label arrow-label-compute">server-only</text>

    <!-- Imports -->
    <line class="arrow arrow-dashed" x1="200" y1="480" x2="200" y2="534" marker-end="url(#arrowBlue)"/>
    <text x="212" y="514" class="arrow-label">imports</text>
    <line class="arrow arrow-dashed" x1="800" y1="480" x2="800" y2="534" marker-end="url(#arrowBlue)"/>
    <text x="812" y="514" class="arrow-label">imports</text>

    <!-- Host to core -->
    <line class="arrow arrow-compute" x1="1275" y1="370" x2="1275" y2="394" marker-end="url(#arrowAmber)"/>
    <text x="1287" y="389" class="arrow-label arrow-label-compute">calls</text>

    <!-- Persistence -->
    <path class="arrow arrow-db" d="M930 450 H965 V880 H994" marker-end="url(#arrowTeal)"/>
    <text x="944" y="680" text-anchor="middle" transform="rotate(-90 944 680)" class="arrow-label arrow-label-db">scoped DbRead / DbWrite</text>

    <!-- Generated tables -->
    <line class="arrow arrow-dashed" x1="470" y1="880" x2="470" y2="836" marker-end="url(#arrowBlue)"/>
    <text x="482" y="862" class="arrow-label">generates</text>
  </g>

  <!-- Footer -->
  <text x="50" y="1100" class="muted">Arteries architecture overview · source of truth: app/diamond.toml, app/*.dia, core/, runner/</text>
  <text x="1550" y="1100" text-anchor="end" class="muted">Diamond + Rust host compute</text>
</svg>
